KAFKA_VERSION: "4.0.0"
SCALA_VERSION: "2.13"
KAFKA_DIR: "/opt/kafka"
KAFKA_TARBALL: "kafka_{{ SCALA_VERSION }}-{{ KAFKA_VERSION }}.tgz"
KAFKA_URL: "https://downloads.apache.org/kafka/{{ KAFKA_VERSION }}/{{ KAFKA_TARBALL }}"
KAFKA_EXTRACT: "kafka_{{ SCALA_VERSION }}-{{ KAFKA_VERSION }}"
KAFKA_SERVER_CONFIG: "{{ KAFKA_DIR }}/config/server.properties"
KAFKA_SERVICE_PATH: "/etc/systemd/system/kafka.service"
KAFKA_LOG_DIR: "/var/lib/kafka"

KAFKA_CLUSTER_ID: kafka-qa
CLIENT_PORT: 9092
CONTROLLER_PORT: 9093
BROKER_PORT: 9094

SASL_USERNAME: admin
SASL_PASSWORD: ""

# Certificate ENV

ORG_UNIT: QA
ORG: Kafka
COMMON_NAME: kafka-new.service.consul
LOCALITY: Baku
STATE_PROVINCE: Baku
COUNTRY: AZ
VALIDITY: 3650

KEYSTORE_PATH: "/opt/kafka/certs"
KEYSTORE_PASS: "123456"
KEY_PASS: "123456"
TRUSTSTORE_PATH: /opt/kafka/certs
TRUSTSTORE_PASS: "123456"

# SSL Type Configuration (JKS or PEM)
SSL_KEYSTORE_TYPE: "JKS"
SSL_TRUSTSTORE_TYPE: "JKS"
SSL_USER_DN: "CN=admin,OU=QA,O=Kafka,L=Baku,ST=Baku,C=AZ"

CERT_PATH: "{{KAFKA_DIR}}/certs"
SCRIPT_PATH: "{{KAFKA_DIR}}/create-ssl.sh"
JAAS_PATH: "{{KAFKA_DIR}}/config/kafka-server-jaas.conf"

## Creating new user and give ACL
HOSTNAME: ""
CLIENT_PASSWORD: 
CLIENT_USERNAME: 
CLIENT_CONFIG: "{{KAFKA_DIR}}/config/client.properties"
TOPICS: "transaction users"
OPERATIONS: "Read Create Delete Write"
GROUP: "rest-api-group"