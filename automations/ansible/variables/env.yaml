HOSTNAME: "10.122.65.180"
CLIENT_PASSWORD: "nici"
CLIENT_USERNAME: "nici"
CLIENT_CONFIG: "{{kafka_dir}}/config/client.properties"
TOPICS:
  - "nici"
  - "test"

