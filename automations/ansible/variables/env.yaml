KAFKA_VERSION: "4.0.0"
SCALA_VERSION: "2.13"
KAFKA_DIR: "/opt/kafka"
KAFKA_TARBALL: "kafka_2.13-4.0.0.tgz"
KAFKA_URL: "https://downloads.apache.org/kafka/4.0.0/kafka_2.13-4.0.0.tgz"
KAFKA_EXTRACT: "kafka_2.13-4.0.0"
KAFKA_SERVER_CONFIG: "/opt/kafka/config/server.properties"
KAFKA_SERVICE_PATH: "/etc/systemd/system/kafka.service"

KAFKA_CLUSTER_ID: "kafkademo"
BROKER_PORT: 9092
CONTROLLER_PORT: 9093

SASL_USERNAME: "admin"
SASL_PASSWORD: "adminpass"

KEYSTORE_PATH: "/opt/kafka/certs/{{inventory_hostname}}.keystore.jks"
KEYSTORE_PASS: "123456"
KEY_PASS: "123456"
TRUSTSTORE_PATH: "/opt/kafka/certs/kafka.truststore.jks"
TRUSTSTORE_PASS: "123456"

CERT_PATH: "/opt/kafka/certs"
SCRIPT_PATH: "/opt/kafka/create-ssl.sh"
JAAS_PATH: "/opt/kafka/config/kafka-server-jaas.conf"

